<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Outer Box -->
  <rect x="10" y="10" width="180" height="180" fill="none" stroke="#FFFFFF" stroke-width="12" rx="4"/>
  
  <!-- Horizontal Dividing Line -->
  <line x1="22" y1="100" x2="178" y2="100" stroke="#FFFFFF" stroke-width="10" stroke-linecap="square"/>
  
  <!-- Text KO (Top) -->
  <text x="100" y="80" fill="#FFFFFF" font-family="'Space Grotesk', 'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="64" text-anchor="middle" letter-spacing="4">KO</text>
  
  <!-- Text DE (Bottom) -->
  <text x="100" y="162" fill="#FFFFFF" font-family="'Space Grotesk', 'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="64" text-anchor="middle" letter-spacing="4">DE</text>
</svg>
